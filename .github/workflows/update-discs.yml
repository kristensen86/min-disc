name: Opdater disc-database

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kør fetch-script
        run: node fetch-discs.mjs

      - name: Commit og push hvis ændret
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/discs.json
          if git diff --staged --quiet; then
            echo "Ingen ændringer i disc-databasen — springer commit over."
          else
            git commit -m "chore: opdater disc-database $(date -u '+%Y-%m-%d')"
            git push
            echo "✓ Ny disc-database committet."
          fi
