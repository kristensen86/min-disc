<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0f1714"/>
  <!-- Outer disc ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f2c14e" stroke-width="18"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f2c14e" stroke-width="12"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#f2c14e" stroke-width="10"/>
  <!-- Center dome -->
  <circle cx="256" cy="256" r="36" fill="#f2c14e"/>
  <!-- Center highlight -->
  <circle cx="244" cy="244" r="12" fill="#0f1714" opacity="0.3"/>
  <!-- Flight path arcs (decorative) -->
  <path d="M 120 200 Q 256 130 392 200" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M 100 240 Q 256 160 412 240" fill="none" stroke="#f2c14e" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
